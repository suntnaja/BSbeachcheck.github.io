<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - GitHub DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <!-- ส่วนตั้งค่า GitHub (เหมือนการล็อกอินเข้าฐานข้อมูล) -->
            <div class="card p-4 mb-4 border-dark border-top border-4 bg-dark text-white">
                <h4>⚙️ ตั้งค่าฐานข้อมูล GitHub (GitHub API)</h4>
                <p class="text-secondary small mb-3">กรอกข้อมูล Repository เพื่อใช้เป็นที่เก็บไฟล์โมเดล <i>(ข้อมูลนี้จะไม่ถูกบันทึกลงโค้ดเพื่อความปลอดภัย)</i></p>
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="ghOwner" class="form-control form-control-sm" placeholder="ชื่อ User (เช่น somchai)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghRepo" class="form-control form-control-sm" placeholder="ชื่อ Repo (เช่น sky-ml)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghPath" class="form-control form-control-sm" value="model_db.json" placeholder="ชื่อไฟล์ปลายทาง">
                    </div>
                    <div class="col-md-3">
                        <input type="password" id="ghToken" class="form-control form-control-sm" placeholder="GitHub PAT Token">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 1: Training Phase -->
            <div class="card p-4 p-md-5 mb-4 border-primary border-top border-4">
                <h3 class="text-primary">🛠️ ส่วนที่ 1: Train & Save to GitHub</h3>
                
                <form id="trainForm" class="mt-3">
                    <div class="mb-3">
                        <input class="form-control" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-2"><b>ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">เริ่ม Train Model</button>
                    </div>
                </form>

                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 fw-bold text-primary">กำลังติดต่อ GitHub API...</p>
                </div>

                <div id="resultSection" class="mt-4" style="display: none;">
                    <div class="alert alert-success"><h5 id="accText" class="mb-1 fw-bold"></h5></div>
                    <button id="saveModelBtn" class="btn btn-dark w-100 fw-bold">☁️ บันทึกโมเดลขึ้น GitHub (Push)</button>
                </div>
            </div>

            <!-- ส่วนที่ 2: Inference Phase -->
            <div class="card p-4 p-md-5 border-success border-top border-4">
                <h3 class="text-success">🔮 ส่วนที่ 2: โหลดจาก GitHub มาทำนาย</h3>
                
                <button id="loadModelBtn" class="btn btn-outline-dark w-100 mb-3">⬇️ ดึงโมเดลล่าสุดจาก GitHub (Pull)</button>
                
                <div id="modelStatusInfo" class="alert alert-secondary text-center">ยังไม่ได้โหลดโมเดล</div>

                <div id="predictSection" style="display: none;">
                    <label class="form-label fw-bold">อัปโหลดภาพใหม่เพื่อทำนาย:</label>
                    <input class="form-control mb-3" type="file" id="predictImage" accept="image/*">
                    <div id="predictResult" style="display:none;"></div>
                </div>
            </div>

            <canvas id="hiddenCanvas" style="display: none;"></canvas>
        </div>
    </div>
</div>

<script>
    class SimpleKNN {
        constructor() { this.data = []; }
        fit(X, y) { this.data = X.map((features, i) => ({ features, label: y[i] })); }
        predict(X_test) {
            return X_test.map(testPoint => {
                let nearest = this.data.reduce((prev, curr) => {
                    let dPrev = this.distance(testPoint, prev.features);
                    let dCurr = this.distance(testPoint, curr.features);
                    return (dPrev < dCurr) ? prev : curr;
                });
                return nearest.label;
            });
        }
        distance(p1, p2) {
            return Math.sqrt(Math.pow(p1[0]-p2[0],2) + Math.pow(p1[1]-p2[1],2) + Math.pow(p1[2]-p2[2],2));
        }

        // === ฟังก์ชันคุยกับ GitHub API ===
        async saveToGitHub(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            };

            // 1. เช็คก่อนว่ามีไฟล์นี้อยู่แล้วหรือไม่ เพื่อเอาค่า SHA (จำเป็นสำหรับการอัปเดตไฟล์ใน GitHub)
            let sha = null;
            try {
                const getRes = await fetch(url, { headers });
                if (getRes.ok) {
                    const getJson = await getRes.json();
                    sha = getJson.sha;
                }
            } catch (e) { console.log("Creating new file..."); }

            // 2. แปลงข้อมูลโมเดลเป็น Base64 (GitHub บังคับ)
            const jsonString = JSON.stringify(this.data);
            const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

            // 3. ส่งคำสั่ง PUT เพื่อสร้างหรือทับไฟล์เดิม
            const body = {
                message: "Update ML Model from Web Interface",
                content: base64Content
            };
            if (sha) body.sha = sha;

            const putRes = await fetch(url, { method: "PUT", headers, body: JSON.stringify(body) });
            return putRes.ok;
        }

        async loadFromGitHub(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { "Accept": "application/vnd.github.v3+json" };
            if (token) headers["Authorization"] = `token ${token}`; // ใส่ Token กันติด Rate Limit

            const res = await fetch(url, { headers });
            if (res.ok) {
                const data = await res.json();
                // ถอดรหัส Base64 กลับเป็น JSON
                const decoded = decodeURIComponent(escape(atob(data.content)));
                this.data = JSON.parse(decoded);
                return true;
            }
            return false;
        }
    }

    const globalModel = new SimpleKNN();

    // ================= Image Processing & UI =================
    function extractColors(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('hiddenCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400; canvas.height = 300;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const skyHeight = Math.floor(canvas.height * 0.3);
                    const data = ctx.getImageData(0, 0, canvas.width, skyHeight).data;
                    let rSum = 0, gSum = 0, bSum = 0;
                    for (let i = 0; i < data.length; i += 4) { rSum += data[i]; gSum += data[i+1]; bSum += data[i+2]; }
                    let count = data.length / 4;
                    resolve({
                        rMean: parseFloat((rSum/count).toFixed(2)),
                        gMean: parseFloat((gSum/count).toFixed(2)),
                        bMean: parseFloat((bSum/count).toFixed(2))
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function getMockWeather(hour) { return (hour >= 15 || hour < 6) ? 0 : 1; }

    document.getElementById('images').addEventListener('change', function(e) {
        const files = e.target.files;
        const container = document.getElementById('fileListContainer');
        const section = document.getElementById('dateTimeInputSection');
        container.innerHTML = '';
        if (files.length > 0) {
            section.style.display = 'block';
            Array.from(files).forEach(file => {
                container.innerHTML += `<div class="d-flex justify-content-between mb-2 p-2 border rounded bg-white">
                    <span class="fw-bold">${file.name}</span>
                    <input type="datetime-local" class="form-control datetime-input w-50" required>
                </div>`;
            });
        } else { section.style.display = 'none'; }
    });

    document.getElementById('trainForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const files = document.getElementById('images').files;
        const inputs = document.querySelectorAll('.datetime-input');
        
        let X = [], y = [];
        for (let i = 0; i < files.length; i++) {
            const color = await extractColors(files[i]);
            X.push([color.rMean, color.gMean, color.bMean]);
            y.push(getMockWeather(new Date(inputs[i].value).getHours()));
        }

        globalModel.fit(X, y);
        document.getElementById('accText').innerText = `✅ Train โมเดลสำเร็จ!`;
        document.getElementById('resultSection').style.display = 'block';
    });

    // ================= GitHub Save / Load =================
    document.getElementById('saveModelBtn').addEventListener('click', async function() {
        const owner = document.getElementById('ghOwner').value;
        const repo = document.getElementById('ghRepo').value;
        const path = document.getElementById('ghPath').value;
        const token = document.getElementById('ghToken').value;

        if(!owner || !repo || !token) return alert("กรุณากรอกข้อมูล GitHub ให้ครบ (รวมถึง Token)");
        
        document.getElementById('loading').style.display = 'block';
        try {
            const success = await globalModel.saveToGitHub(owner, repo, path, token);
            if(success) alert("☁️ อัปโหลดไฟล์โมเดลขึ้น GitHub สำเร็จแล้ว!");
            else alert("❌ เกิดข้อผิดพลาด ตรวจสอบ Token, ชื่อ User หรือ Repo อีกครั้ง");
        } catch(e) { alert("❌ Error: " + e.message); }
        document.getElementById('loading').style.display = 'none';
    });

    document.getElementById('loadModelBtn').addEventListener('click', async function() {
        const owner = document.getElementById('ghOwner').value;
        const repo = document.getElementById('ghRepo').value;
        const path = document.getElementById('ghPath').value;
        const token = document.getElementById('ghToken').value; // ใส่เพื่อป้องกัน Rate Limit

        if(!owner || !repo) return alert("กรุณากรอกชื่อ User และ Repo ก่อนโหลดโมเดล");

        document.getElementById('loading').style.display = 'block';
        try {
            const success = await globalModel.loadFromGitHub(owner, repo, path, token);
            if(success) {
                document.getElementById('modelStatusInfo').className = "alert alert-success text-center";
                document.getElementById('modelStatusInfo').innerText = `✅ ดึงโมเดลจาก GitHub สำเร็จ (ข้อมูล ${globalModel.data.length} ชุด)`;
                document.getElementById('predictSection').style.display = 'block';
            } else {
                alert("❌ ไม่พบไฟล์โมเดลใน GitHub หรือเกิดข้อผิดพลาด");
            }
        } catch(e) { alert("❌ Error: " + e.message); }
        document.getElementById('loading').style.display = 'none';
    });

    // ================= Predict =================
    document.getElementById('predictImage').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const color = await extractColors(file);
        const result = globalModel.predict([[color.rMean, color.gMean, color.bMean]]);
        
        const resDiv = document.getElementById('predictResult');
        resDiv.style.display = 'block';
        resDiv.className = result[0] === 1 ? "alert alert-warning text-center mt-3" : "alert alert-secondary text-center mt-3";
        resDiv.innerHTML = `<h3 class="fw-bold">${result[0] === 1 ? "☀️ ท้องฟ้าแจ่มใส" : "☁️ อากาศหม่น"}</h3>`;
    });
</script>

</body>
</html>
