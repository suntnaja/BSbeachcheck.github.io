<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - Manual Input</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
        .thumbnail-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card p-4 p-md-5">
                <h2 class="text-center mb-4 text-primary">☁️ Sky Weather ML Training</h2>
                <p class="text-center text-muted">ระบบทำงานบนเบราว์เซอร์ 100% (Serverless)</p>
                
                <!-- ฟอร์มหลัก -->
                <form id="trainForm" class="mt-4">
                    <div class="mb-4">
                        <label for="images" class="form-label"><b>1. อัปโหลดภาพถ่ายท้องฟ้า (เลือกได้หลายไฟล์)</b></label>
                        <input class="form-control form-control-lg" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <!-- ส่วนที่จะแสดงรายการรูปภาพเพื่อให้กรอกวันที่ (ถูกซ่อนไว้ตอนแรก) -->
                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-3"><b>2. ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-4">
                            <!-- รายการไฟล์จะถูกสร้างด้วย JavaScript ที่นี่ -->
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">เริ่มสกัดสีและ Train Model</button>
                    </div>
                </form>

                <!-- สถานะโหลด -->
                <div id="loading" class="text-center mt-5">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
                    <p class="mt-3 fw-bold text-primary">กำลังประมวลผลภาพและ Train Model...</p>
                </div>

                <!-- แสดงผลลัพธ์ -->
                <div id="resultSection" class="mt-5" style="display: none;">
                    <h4>🎯 ผลการประเมิน (Evaluation)</h4>
                    <div class="alert alert-success border-0 shadow-sm">
                        <h5 id="accText" class="mb-1 text-success fw-bold"></h5>
                        <small>ใช้ K-Nearest Neighbors (KNN) Train จากข้อมูลที่คุณกรอก</small>
                    </div>

                    <h4 class="mt-5">📊 ข้อมูล Features ที่สกัดจากภาพ</h4>
                    <div class="table-responsive">
                        <table class="table table-hover text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ภาพ</th>
                                    <th>วันเวลาที่บันทึก</th>
                                    <th>R, G, B (เฉลี่ย)</th>
                                    <th>สภาพอากาศ (จำลอง)</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody">
                                <!-- ข้อมูลตารางจะถูกแทรกที่นี่ -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Canvas ที่ซ่อนไว้สำหรับประมวลผลภาพ -->
                <canvas id="hiddenCanvas" style="display: none;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // UI: จัดการเมื่อผู้ใช้เลือกไฟล์ภาพ
    // ==========================================
    document.getElementById('images').addEventListener('change', function(e) {
        const files = e.target.files;
        const container = document.getElementById('fileListContainer');
        const section = document.getElementById('dateTimeInputSection');
        
        container.innerHTML = ''; // ล้างข้อมูลเก่า
        
        if (files.length > 0) {
            section.style.display = 'block'; // แสดงส่วนกรอกวันที่
            
            // วนลูปสร้างช่องกรอกวันที่สำหรับแต่ละไฟล์
            Array.from(files).forEach((file, index) => {
                const previewUrl = URL.createObjectURL(file);
                
                const div = document.createElement('div');
                div.className = 'd-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 p-3 border rounded bg-white shadow-sm';
                div.innerHTML = `
                    <div class="d-flex align-items-center mb-2 mb-md-0">
                        <img src="${previewUrl}" class="thumbnail-img me-3">
                        <span class="fw-bold text-truncate" style="max-width: 150px;" title="${file.name}">${file.name}</span>
                    </div>
                    <div>
                        <input type="datetime-local" class="form-control datetime-input" data-index="${index}" required>
                    </div>
                `;
                container.appendChild(div);
            });
        } else {
            section.style.display = 'none';
        }
    });

    // ==========================================
    // 1. Image Processing Functions
    // ==========================================
    function extractColors(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('hiddenCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = 400;
                    canvas.height = 300;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const skyHeight = Math.floor(canvas.height * 0.3); // ตัด 30% บน
                    const imgData = ctx.getImageData(0, 0, canvas.width, skyHeight);
                    const data = imgData.data;
                    
                    let rSum = 0, gSum = 0, bSum = 0;
                    let pixelCount = data.length / 4;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        rSum += data[i];
                        gSum += data[i+1];
                        bSum += data[i+2];
                    }
                    
                    resolve({
                        previewUrl: e.target.result,
                        filename: file.name,
                        rMean: parseFloat((rSum / pixelCount).toFixed(2)),
                        gMean: parseFloat((gSum / pixelCount).toFixed(2)),
                        bMean: parseFloat((bSum / pixelCount).toFixed(2))
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // ==========================================
    // 2. Mock Weather Data from Manual Time
    // ==========================================
    function getMockWeather(hour) {
        // สร้างเงื่อนไขจำลอง: ถ้าหลัง 15:00 น. หรือก่อน 06:00 น. ให้เป็นเมฆมาก (Gloomy)
        if (hour >= 15 || hour < 6) {
            return { status: "Gloomy", label: 0 };
        } else {
            return { status: "Clear", label: 1 };
        }
    }

    // ==========================================
    // 3. Simple ML: K-Nearest Neighbors (KNN)
    // ==========================================
    class SimpleKNN {
        constructor() { this.data = []; }
        fit(X, y) {
            this.data = X.map((features, i) => ({ features, label: y[i] }));
        }
        predict(X_test) {
            return X_test.map(testPoint => {
                let nearest = this.data.reduce((prev, curr) => {
                    let dPrev = this.distance(testPoint, prev.features);
                    let dCurr = this.distance(testPoint, curr.features);
                    return (dPrev < dCurr) ? prev : curr;
                });
                return nearest.label;
            });
        }
        distance(p1, p2) {
            return Math.sqrt(Math.pow(p1[0]-p2[0],2) + Math.pow(p1[1]-p2[1],2) + Math.pow(p1[2]-p2[2],2));
        }
    }

    // ==========================================
    // 4. Main Submit Event
    // ==========================================
    document.getElementById('trainForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const files = document.getElementById('images').files;
        const datetimeInputs = document.querySelectorAll('.datetime-input');
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';
        document.getElementById('dateTimeInputSection').style.display = 'none';

        let processedData = [];
        let X = [];
        let y = [];

        // วนลูปอ่านค่าสี และอ่านค่า วัน/เวลา ที่ผู้ใช้กรอก
        for (let i = 0; i < files.length; i++) {
            const colorFeatures = await extractColors(files[i]);
            
            // ดึงค่า Date & Time ที่ผู้ใช้กรอก
            const dateTimeValue = datetimeInputs[i].value; // รูปแบบ: "2023-10-01T14:30"
            const dateObj = new Date(dateTimeValue);
            const hour = dateObj.getHours(); // สกัดเฉพาะชั่วโมงมาประเมินสภาพอากาศ
            
            // จำลองสภาพอากาศโดยอิงจากชั่วโมงที่ผู้ใช้กรอกจริงๆ
            const weather = getMockWeather(hour);
            
            processedData.push({
                ...colorFeatures,
                dateTimeFormatted: dateTimeValue.replace('T', ' '),
                weatherStatus: weather.status
            });

            X.push([colorFeatures.rMean, colorFeatures.gMean, colorFeatures.bMean]);
            y.push(weather.label);
        }

        // Training
        const knn = new SimpleKNN();
        knn.fit(X, y); 
        const predictions = knn.predict(X); 
        
        let correct = 0;
        for(let i=0; i<y.length; i++) {
            if(y[i] === predictions[i]) correct++;
        }
        let accuracy = (correct / y.length) * 100;

        // วาดตารางแสดงผลลัพธ์
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';
        
        processedData.forEach(row => {
            const statusBadge = row.weatherStatus === 'Clear' ? 
                '<span class="badge bg-warning text-dark">Clear ☀️</span>' : 
                '<span class="badge bg-secondary">Gloomy ☁️</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${row.previewUrl}" class="thumbnail-img"></td>
                <td>
                    <strong>${row.filename}</strong><br>
                    <small class="text-muted">${row.dateTimeFormatted}</small>
                </td>
                <td><span style="color:red">${row.rMean}</span>, <span style="color:green">${row.gMean}</span>, <span style="color:blue">${row.bMean}</span></td>
                <td>${statusBadge}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('accText').innerText = `ความแม่นยำของโมเดล: ${accuracy.toFixed(2)}%`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
    });
</script>

</body>
</html>
