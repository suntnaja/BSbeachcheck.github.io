<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - Data Collector & Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <!-- ส่วนตั้งค่า GitHub -->
            <div class="card p-4 mb-4 border-dark border-top border-4 bg-dark text-white">
                <h4>⚙️ ตั้งค่าการเชื่อมต่อ GitHub API</h4>
                <p class="text-secondary small mb-3">กรอกข้อมูลเพื่อใช้อัปเดตไฟล์โมเดล (Token จะไม่ถูกบันทึกลงโค้ด)</p>
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="ghOwner" class="form-control form-control-sm" placeholder="ชื่อ User" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghRepo" class="form-control form-control-sm" placeholder="ชื่อ Repo" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghPath" class="form-control form-control-sm" value="model_db.json" placeholder="ชื่อไฟล์">
                    </div>
                    <div class="col-md-3">
                        <input type="password" id="ghToken" class="form-control form-control-sm" placeholder="PAT Token">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 1: Training Phase (เหลือเพียงส่วนนี้) -->
            <div class="card p-4 p-md-5 mb-4 border-primary border-top border-4">
                <h3 class="text-primary">🛠️ ระบบนำเข้าข้อมูลและ Train Model</h3>
                <p class="text-muted small">รูปภาพใหม่ที่ถูก Train จะถูกนำไปต่อท้ายข้อมูลโมเดลเดิมบน GitHub</p>
                
                <form id="trainForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. เลือกภาพถ่ายท้องฟ้า (เลือกได้หลายไฟล์)</label>
                        <input class="form-control" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-2 mt-3"><b>2. ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-4"></div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">เริ่มสกัดค่าสี (Train)</button>
                    </div>
                </form>

                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 fw-bold text-primary" id="loadingText">กำลังประมวลผล...</p>
                </div>

                <!-- ส่วนแสดงผลและปุ่มเซฟขึ้น GitHub -->
                <div id="resultSection" class="mt-4" style="display: none;">
                    <div class="alert alert-success">
                        <h5 id="accText" class="mb-1 fw-bold text-center"></h5>
                    </div>
                    <button id="saveModelBtn" class="btn btn-dark btn-lg w-100 fw-bold mt-2">☁️ ผสานข้อมูลและอัปเดตขึ้น GitHub (Merge & Push)</button>
                </div>
            </div>

            <canvas id="hiddenCanvas" style="display: none;"></canvas>
        </div>
    </div>
</div>

<script>
    class SimpleKNN {
        constructor() { this.data = []; }
        
        // นำข้อมูลใหม่ไปต่อท้าย
        appendFit(X, y) { 
            const newData = X.map((features, i) => ({ features, label: y[i] }));
            this.data = [...this.data, ...newData]; 
        }

        // === ฟังก์ชันคุยกับ GitHub API แบบ Merge (อัปเดตไฟล์) ===
        async saveAndUpdateGitHub(owner, repo, path, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            };

            let sha = null;
            let existingData = [];

            // 1. ดึงไฟล์เดิมจาก GitHub เพื่อดูข้อมูลเก่าและดึงค่า SHA มาใช้อัปเดต
            try {
                const getRes = await fetch(url, { headers });
                if (getRes.ok) {
                    const getJson = await getRes.json();
                    sha = getJson.sha; 
                    const decoded = decodeURIComponent(escape(atob(getJson.content)));
                    existingData = JSON.parse(decoded);
                }
            } catch (e) { 
                console.log("No existing file found. Will create a new one."); 
            }

            // 2. นำข้อมูลเก่า + ข้อมูลใหม่ มารวมกัน
            let combined = [...existingData, ...this.data];
            
            // 3. กรองข้อมูลซ้ำซ้อน (Deduplication) กันไฟล์บวม
            let uniqueData = [];
            let seen = new Set();
            for (let item of combined) {
                let key = `${item.features.join('_')}_${item.label}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueData.push(item);
                }
            }
            
            this.data = uniqueData; // อัปเดตข้อมูลชุดใหม่ล่าสุดไว้ในตัวแปร

            // 4. แปลงข้อมูลและ Push กลับขึ้น GitHub
            const jsonString = JSON.stringify(this.data);
            const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

            const body = {
                message: `Update ML Model (Total features: ${this.data.length})`,
                content: base64Content
            };
            if (sha) body.sha = sha; 

            const putRes = await fetch(url, { method: "PUT", headers, body: JSON.stringify(body) });
            return { success: putRes.ok, totalCount: this.data.length };
        }
    }

    const globalModel = new SimpleKNN();

    // ================= Image Processing & UI =================
    function extractColors(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('hiddenCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400; canvas.height = 300;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const skyHeight = Math.floor(canvas.height * 0.3);
                    const data = ctx.getImageData(0, 0, canvas.width, skyHeight).data;
                    let rSum = 0, gSum = 0, bSum = 0;
                    let count = data.length / 4;
                    for (let i = 0; i < data.length; i += 4) { rSum += data[i]; gSum += data[i+1]; bSum += data[i+2]; }
                    resolve({
                        rMean: parseFloat((rSum/count).toFixed(2)),
                        gMean: parseFloat((gSum/count).toFixed(2)),
                        bMean: parseFloat((bSum/count).toFixed(2))
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // ฟังก์ชันจำลองสภาพอากาศ
    function getMockWeather(hour) { return (hour >= 15 || hour < 6) ? 0 : 1; }

    document.getElementById('images').addEventListener('change', function(e) {
        const files = e.target.files;
        const container = document.getElementById('fileListContainer');
        const section = document.getElementById('dateTimeInputSection');
        container.innerHTML = '';
        
        if (files.length > 0) {
            section.style.display = 'block';
            Array.from(files).forEach(file => {
                container.innerHTML += `<div class="d-flex align-items-center justify-content-between mb-2 p-3 border rounded bg-white shadow-sm">
                    <span class="fw-bold text-truncate me-2" style="max-width: 50%;">${file.name}</span>
                    <input type="datetime-local" class="form-control datetime-input" style="max-width: 45%;" required>
                </div>`;
            });
        } else { section.style.display = 'none'; }
    });

    // ================= Train (Append Local Data) =================
    document.getElementById('trainForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const files = document.getElementById('images').files;
        const inputs = document.querySelectorAll('.datetime-input');
        
        document.getElementById('loadingText').innerText = "กำลังสกัดค่าสีและเรียนรู้ภาพใหม่...";
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';

        let X = [], y = [];
        for (let i = 0; i < files.length; i++) {
            const color = await extractColors(files[i]);
            X.push([color.rMean, color.gMean, color.bMean]);
            y.push(getMockWeather(new Date(inputs[i].value).getHours()));
        }

        // เพิ่มข้อมูลลงไปในโมเดลแบบต่อท้าย (Append)
        globalModel.appendFit(X, y);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('accText').innerText = `✅ ประมวลผลเสร็จสิ้น! (เตรียมพร้อม ${files.length} ภาพ)`;
        document.getElementById('resultSection').style.display = 'block';
    });

    // ================= GitHub Save/Update (Merge Data) =================
    document.getElementById('saveModelBtn').addEventListener('click', async function() {
        const owner = document.getElementById('ghOwner').value;
        const repo = document.getElementById('ghRepo').value;
        const path = document.getElementById('ghPath').value;
        const token = document.getElementById('ghToken').value;

        if(!owner || !repo || !token) return alert("กรุณากรอกข้อมูล GitHub ให้ครบ (รวมถึง Token)");
        
        document.getElementById('loadingText').innerText = "กำลังดึงข้อมูลเดิมมาผสาน และอัปเดตไฟล์ขึ้น GitHub...";
        document.getElementById('loading').style.display = 'block';
        
        try {
            const result = await globalModel.saveAndUpdateGitHub(owner, repo, path, token);
            if(result.success) {
                alert(`☁️ อัปเดตไฟล์โมเดลขึ้น GitHub สำเร็จ!\n(ตอนนี้ฐานข้อมูลมีข้อมูลทั้งหมด ${result.totalCount} ชุด)`);
                document.getElementById('accText').innerText = `☁️ อัปเดตขึ้น GitHub แล้ว (รวมทั้งหมด ${result.totalCount} ชุด)`;
                
                // ล้างข้อมูลชั่วคราวเพื่อป้องกันการกดเซฟเบิ้ล
                globalModel.data = [];
            }
            else alert("❌ เกิดข้อผิดพลาด ตรวจสอบ Token, ชื่อ User หรือ Repo อีกครั้ง");
        } catch(e) { alert("❌ Error: " + e.message); }
        
        document.getElementById('loading').style.display = 'none';
    });
</script>

</body>
</html>
