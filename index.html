<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - Data Collector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <!-- ส่วนตั้งค่า GitHub -->
            <div class="card p-4 mb-4 border-dark border-top border-4 bg-dark text-white">
                <h4>⚙️ ตั้งค่าการเชื่อมต่อ GitHub API</h4>
                <p class="text-secondary small mb-3">กรอกข้อมูลเพื่อใช้อัปเดตไฟล์โมเดล (Token จะไม่ถูกบันทึกลงโค้ด)</p>
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="ghOwner" class="form-control form-control-sm" placeholder="ชื่อ User" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghRepo" class="form-control form-control-sm" placeholder="ชื่อ Repo" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="ghPath" class="form-control form-control-sm" value="model_db.json" placeholder="ชื่อไฟล์">
                    </div>
                    <div class="col-md-3">
                        <input type="password" id="ghToken" class="form-control form-control-sm" placeholder="PAT Token">
                    </div>
                </div>
            </div>

            <!-- ส่วนการนำเข้าข้อมูล (Interface) -->
            <div class="card p-4 p-md-5 mb-4 border-primary border-top border-4">
                <h3 class="text-primary">🛠️ ระบบนำเข้าข้อมูลและ Train Model</h3>
                <p class="text-muted small">รูปภาพใหม่ที่ถูก Train จะถูกนำไปต่อท้ายข้อมูลโมเดลเดิมบน GitHub</p>
                
                <form id="trainForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. เลือกภาพถ่ายท้องฟ้า (เลือกได้หลายไฟล์)</label>
                        <input class="form-control" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-2 mt-3"><b>2. ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-4"></div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">เริ่มสกัดค่าสี (Train)</button>
                    </div>
                </form>

                <!-- สถานะการทำงาน -->
                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 fw-bold text-primary" id="loadingText">กำลังประมวลผล...</p>
                </div>

                <!-- ผลลัพธ์และปุ่ม Action -->
                <div id="resultSection" class="mt-4" style="display: none;">
                    <div class="alert alert-success">
                        <h5 id="accText" class="mb-1 fw-bold text-center"></h5>
                    </div>
                    <button id="saveModelBtn" class="btn btn-dark btn-lg w-100 fw-bold mt-2">☁️ ผสานข้อมูลและอัปเดตขึ้น GitHub (Merge & Push)</button>
                </div>
            </div>

            <!-- Canvas ซ่อนไว้สำหรับดึงค่าสีภาพ -->
            <canvas id="hiddenCanvas" style="display: none;"></canvas>
        </div>
    </div>
</div>

<!-- เชื่อมต่อไปยังไฟล์ Action/Logic -->
<script src="app.js"></script>
</body>
</html>
