<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - 100% Serverless</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
        /* เพิ่ม CSS สำหรับแสดงผลตารางและรูปภาพ */
        .thumbnail-img { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-10">

            <!-- ส่วนการนำเข้าข้อมูล (Interface) -->
            <div class="card p-4 p-md-5 mb-4 border-primary border-top border-4">
                <h3 class="text-primary">🛠️ ระบบนำเข้าข้อมูลภาพ BSbeach Machine Learning </h3>
                
                <form id="trainForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. เลือกภาพถ่ายท้องฟ้า (เลือกได้หลายไฟล์)</label>
                        <input class="form-control" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-2 mt-3"><b>2. ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-4"></div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">เชื่อมโยงกับข้อมูลสภาพอากาศและจับกลุ่ม</button>
                    </div>
                </form>

                <!-- สถานะการทำงาน -->
                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 fw-bold text-primary" id="loadingText">กำลังประมวลผล...</p>
                </div>

                <!-- ผลลัพธ์และปุ่ม Action (เพิ่มตารางแสดงผลในส่วนนี้) -->
                <div id="resultSection" class="mt-4" style="display: none;">
                    <hr>
                    <h4 class="text-primary mb-3">📊 ผลการวิเคราะห์ข้อมูล</h4>
                    
                    <div class="table-responsive mb-4">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th width="15%">รูปภาพ</th>
                                    <th width="65%">ข้อมูลสภาพอากาศ</th>
                                    <th width="20%" class="text-center">กลุ่ม (Label)</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody">
                                <!-- ข้อมูลจาก app.js จะมาแสดงตรงนี้ -->
                            </tbody>
                        </table>
                    </div>

                    <div class="alert alert-success">
                        <h5 id="accText" class="mb-1 fw-bold text-center"></h5>
                    </div>
                    <button id="saveModelBtn" class="btn btn-dark btn-lg w-100 fw-bold mt-2">☁️ ยืนยันอัปโหลดรูปภาพ</button>
                </div>
            </div>

            <!-- Canvas ซ่อนไว้สำหรับดึงค่าสีภาพแทน OpenCV -->
            <canvas id="hiddenCanvas" style="visibility: hidden; position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
        </div>
    </div>
</div>

<!-- เรียกใช้ไฟล์ JavaScript แทน Python Backend -->
<script src="app.js"></script>
</body>
</html>
