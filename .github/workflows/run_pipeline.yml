name: 🚀 Auto Run Data Pipeline

# 1. กำหนดเงื่อนไขการทำงาน (Trigger)
on:
  push:
    branches:
      - main # หรือ master (เปลี่ยนให้ตรงกับ branch หลักของคุณ)
    paths:
      - 'data/raw_metadata.csv' # สั่งให้รันเฉพาะเมื่อไฟล์ข้อมูลอัปเดต (เวลาหน้าเว็บกด Save)
      - 'images/**'        # หรือเมื่อมีรูปภาพใหม่เข้ามาในโฟลเดอร์ images

# 2. ตั้งค่าสิทธิ์ให้ Action สามารถเซฟไฟล์ทับกลับลงไปใน GitHub ได้
permissions:
  contents: write

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest # ใช้เซิร์ฟเวอร์ Linux ของ GitHub (ฟรี)

    steps:
      # Step 1: ดึงโค้ดทั้งหมดจาก Repository ของคุณมาที่เซิร์ฟเวอร์
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Step 2: ติดตั้ง Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: ติดตั้งไลบรารีที่จำเป็นสำหรับสคริปต์ของคุณ
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ใช้ opencv-python-headless แทนเวอร์ชันปกติ เพื่อป้องกัน Error บน Server ที่ไม่มีจอภาพ
          pip install pandas opencv-python-headless torch torchvision transformers Pillow

      # Step 4: สั่งรันสคริปต์ Python
      - name: ⚙️ Run data pipeline
        run: |
          python train/data_pipeline.py

      # Step 5: นำไฟล์ model_db.csv ที่ได้จากการสกัดสี เซฟและ Push กลับขึ้น GitHub
      - name: 💾 Commit and Push results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🌟 เปลี่ยนเป็น git add . (ใส่จุด) เพื่อให้ระบบกวาดไฟล์ที่มีการเปลี่ยนแปลงทั้งหมด ไม่ว่าจะอยู่โฟลเดอร์ไหน
          git add .
          
          git commit -m "🤖 Auto-update data from SegFormer AI pipeline" || echo "No changes to commit"
          git push
