name: 🚀 Auto Pipeline & Train Model

# กระตุ้นให้ทำงานเมื่อมีการอัปโหลดรูปภาพใหม่เข้ามา
on:
  push:
    branches:
      - main 
    paths:
      - 'images/**' # ปรับให้ตรงกับโฟลเดอร์เก็บรูปภาพของคุณ

# อนุญาตให้บอทสามารถเขียนไฟล์ทับกลับลงไปใน GitHub ได้
permissions:
  contents: write

jobs:
  process-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ติดตั้งไลบรารีแบบมัดรวมสำหรับทั้ง 2 สคริปต์
      - name: 📦 Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas opencv-python-headless torch torchvision transformers Pillow numpy scikit-learn joblib

      # ---------------------------------------------------------
      # ลำดับที่ 1: รันสคริปต์สกัดสีท้องฟ้า (สร้าง model_db.csv)
      # ---------------------------------------------------------
      - name: ⚙️ Step 1 - Run Data Pipeline
        run: |
          python data_pipeline.py

      # ---------------------------------------------------------
      # ลำดับที่ 2: รันสคริปต์เทรนโมเดล (อ่าน model_db.csv -> สร้าง .pkl)
      # ---------------------------------------------------------
      - name: 🧠 Step 2 - Run Training Script
        run: |
          python train_model.py

      # ---------------------------------------------------------
      # ลำดับที่ 3: บันทึกไฟล์ทั้งหมดกลับขึ้น GitHub
      # ---------------------------------------------------------
      - name: 💾 Step 3 - Commit and Push all results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # ใช้ git add . เพื่อกวาดเก็บทั้ง model_db.csv และไฟล์โมเดล .pkl
          git add .
          
          # เช็คว่ามีไฟล์เปลี่ยนจริงไหมก่อน commit เพื่อป้องกัน Error
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update Database & ML Model" && git push)
