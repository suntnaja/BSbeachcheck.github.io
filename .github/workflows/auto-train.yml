name: Auto Train ML Model

# กำหนดให้ทำงานเมื่อมีการ Push ทับไฟล์ model_db.json
on:
  push:
    paths:
      - 'data/model_db.csv'

jobs:
  train-and-save:
    runs-on: ubuntu-latest
    
    # อนุญาตให้ Action นี้สามารถเขียนไฟล์ (Commit & Push) กลับลง Repo ได้
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Run Training Script
        run: python train_model.py

      - name: Commit and Push Updated Model
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sky_weather_rf_model.pkl
          
          # ตรวจสอบว่าไฟล์โมเดลมีการเปลี่ยนแปลงจริงก่อน Commit ป้องกันระบบแจ้งเตือน Error
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update ML model [skip ci]" && git push)
