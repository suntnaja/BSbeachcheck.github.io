<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Weather ML - Python Backend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; }
        #loading { display: none; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <div class="card p-4 p-md-5 mb-4 border-primary border-top border-4">
                <h3 class="text-primary">🛠️ ระบบนำเข้าข้อมูล (Python Training)</h3>
                <p class="text-muted small">ระบบจะส่งรูปภาพและเวลาไปยังเซิร์ฟเวอร์ Python เพื่อสกัดสีและบันทึกภาพ</p>
                
                <form id="trainForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. เลือกภาพถ่ายท้องฟ้า (เลือกได้หลายไฟล์)</label>
                        <input class="form-control" type="file" id="images" accept="image/*" multiple required>
                    </div>

                    <div id="dateTimeInputSection" style="display: none;">
                        <label class="form-label mb-2 mt-3"><b>2. ระบุวันและเวลาของแต่ละภาพ</b></label>
                        <div id="fileListContainer" class="mb-4"></div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">ส่งข้อมูลไป Train ที่ Python</button>
                    </div>
                </form>

                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 fw-bold text-primary">กำลังอัปโหลดและรอให้ Python ประมวลผล...</p>
                </div>

                <div id="resultSection" class="mt-4" style="display: none;">
                    <div class="alert alert-success text-center">
                        <h4 id="accText" class="mb-2 fw-bold"></h4>
                        <p id="msgText" class="mb-0 text-dark"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // 1. จัดการเมื่อเลือกไฟล์ภาพ (แสดงช่องใส่วันที่)
    document.getElementById('images').addEventListener('change', function(e) {
        const files = e.target.files;
        const container = document.getElementById('fileListContainer');
        const section = document.getElementById('dateTimeInputSection');
        container.innerHTML = '';
        
        if (files.length > 0) {
            section.style.display = 'block';
            Array.from(files).forEach((file, index) => {
                container.innerHTML += `
                <div class="d-flex align-items-center justify-content-between mb-2 p-3 border rounded bg-white shadow-sm">
                    <span class="fw-bold text-truncate me-2" style="max-width: 50%;">${file.name}</span>
                    <input type="datetime-local" class="form-control datetime-input" data-index="${index}" style="max-width: 45%;" required>
                </div>`;
            });
        } else { 
            section.style.display = 'none'; 
        }
    });

    // 2. จัดการเมื่อกดปุ่ม Submit
    document.getElementById('trainForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('images');
        const timeInputs = document.querySelectorAll('.datetime-input');
        
        // เตรียมข้อมูลส่งผ่าน FormData ให้อ่านได้ใน Python (Flask)
        const formData = new FormData();
        Array.from(fileInput.files).forEach((file, index) => {
            formData.append('images', file);
            formData.append('timestamps', timeInputs[index].value);
        });

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';

        try {
            // ส่งข้อมูลไปยัง Python Backend
            const response = await fetch('/train', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (response.ok) {
                document.getElementById('accText').innerText = `✅ โมเดลมีความแม่นยำ: ${result.accuracy}%`;
                document.getElementById('msgText').innerText = result.message;
                
                // เคลียร์ฟอร์ม
                document.getElementById('trainForm').reset();
                document.getElementById('fileListContainer').innerHTML = '';
                document.getElementById('dateTimeInputSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';
            } else {
                alert("❌ เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: " + result.error);
            }
        } catch (error) {
            console.error('Error:', error);
            alert("❌ ไม่สามารถเชื่อมต่อกับ Python Server ได้ กรุณาตรวจสอบว่ารัน Flask หรือยัง");
        }
        
        document.getElementById('loading').style.display = 'none';
    });
</script>

</body>
</html>
